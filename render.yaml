services:
  - type: web
    name: ecofeast-backend
    env: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py migrate --noinput
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ecofeast-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: ecofeast-redis
          property: connectionString
      - key: AI_SERVICE_HOST
        fromService:
          type: web
          name: ecofeast-ai
          property: host
      - key: SECRET_KEY
        generateValue: true

  - type: web
    name: ecofeast-ai
    env: python
    plan: free
    rootDir: ai_service
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ecofeast-db
          property: connectionString
      - key: QDRANT_HOST
        fromService:
          type: web
          name: qdrant-server
          property: host
      - key: QDRANT_PORT
        fromService:
          type: web
          name: qdrant-server
          property: port
      - key: SECRET_KEY
        generateValue: true

  - type: redis
    name: ecofeast-redis
    plan: free
    ipAllowList: []

  - type: web
    name: qdrant-server
    env: image
    plan: free
    image:
      url: qdrant/qdrant:latest

databases:
  - name: ecofeast-db
    plan: free
    databaseName: ecofeast
    user: ecofeast_user
