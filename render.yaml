services:
  - type: web
    name: ecofeast-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py migrate --noinput
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ecofeast-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: ecofeast-redis
          property: connectionString
      - key: AI_SERVICE_URL
        fromService:
          type: web
          name: ecofeast-ai
          property: url
      - key: SECRET_KEY
        generateValue: true

  - type: web
    name: ecofeast-ai
    env: python
    rootDir: ai_service
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ecofeast-db
          property: connectionString
      - key: QDRANT_URL
        fromService:
          type: web
          name: qdrant-server
          property: url
      - key: SECRET_KEY
        generateValue: true

  - type: redis
    name: ecofeast-redis
    ipAllowList: []

  - type: web
    name: qdrant-server
    env: docker
    repo: https://github.com/qdrant/qdrant
    branch: master
    dockerfilePath: Dockerfile

databases:
  - name: ecofeast-db
    databaseName: ecofeast
    user: ecofeast_user
